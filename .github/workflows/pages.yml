# Publishes the playground in web/ to GitHub Pages (https://cebor.github.io/gsichtl/).
#
# Every release tag deploys it, so the page draws the pictures of the version on crates.io.
# Between releases it can be deployed from main by hand: Actions → Pages → Run workflow.

name: Pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web
      # The version pinned for wasm-bindgen in web/Cargo.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - run: web/build.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
